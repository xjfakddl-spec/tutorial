<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>프론트엔드 공부용</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>프론트엔드 공부용</h1>
    </header>
    <div class="layout">
      <main>
        <h2>각 프로그램의 코드 정리</h2>
        <p>프론트엔드 공부를 위한 메모</p>
        <p>Html Css JavaScript등의 코드와 쓰임세를 메모함.</p>
        <p>업데이트 중</p>
        <section class="codes">
          <a id="html-code" href="html-code.html" target="_blank">
            <h3>Html</h3>
            <p>Html 코드 모음으로 이동합니다.</p>
          </a>
          <a id="Css-code" href="Css-code.html" target="_blank">
            <h3>Css</h3>
            <p>Css 코드 모음으로 이동합니다.</p>
            <p>업데이트 중</p>
          </a>
          <a id="JS-code" href="JS-code.html" target="_blank">
            <h3>JavaScript</h3>
            <p>JavaScript 코드 모음으로 이동합니다.</p>
            <p>업데이트 중</p>
          </a>
        </section>
        <section class="contact">
          <form id="contact">
            <label for="name">이름:</label>
            <input
              type="text"
              id="name"
              name="name"
              placeholder="이름을 적으세요."
              required
            />
            <label for="email">이메일:</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="이메일을 적으세요."
              required
            />
            <label for="message">메시지:</label>
            <textarea
              id="message"
              name="message"
              placeholder="메시지를 적으세요."
              required
            ></textarea>
            <button type="submit">보내기</button>
          </form>
        </section>
      </main>
    </div>
    <footer>
      <p>제작자 Ara</p>
    </footer>
  </body>
</html>
